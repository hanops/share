<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafb;color:#1a2b33;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.container{max-width:560px;width:100%}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.sub{font-size:14px;color:#6b8792;margin-bottom:36px}
.cards{display:grid;gap:12px}
.card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #e2eaed;border-radius:14px;padding:20px 22px;text-decoration:none;color:inherit;transition:.3s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.07);border-color:#00a896}
.card .icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#e2f5f1,#d0ede8);display:grid;place-items:center;flex:none;font-size:20px}
.card .info{flex:1;min-width:0}
.card .info b{font-size:15px;font-weight:700;display:block}
.card .info span{font-size:12px;color:#6b8792;margin-top:3px;display:block}
.card .arrow{color:#b0c4ca;font-size:18px;transition:.3s}
.card:hover .arrow{color:#00a896;transform:translateX(3px)}
.foot{margin-top:40px;text-align:center;font-size:11px;color:#a0b8c0}
</style>
</head>
<body>
<div class="container">
  <h1>Shared Pages</h1>
  <p class="sub">All my shared web pages in one place.</p>
  <div class="cards">
    <a class="card" href="./ergonomic-chair/">
      <div class="icon">&#128186;</div>
      <div class="info">
        <b>SPINAIR S9 Pro 人体工学椅</b>
        <span>电商详情页设计 &middot; 12 屏长图 &middot; 2026-07</span>
      </div>
      <span class="arrow">&rarr;</span>
    </a>
    <a class="card" href="./kakeya/">
      <div class="icon">&#128208;</div>
      <div class="info">
        <b>挂谷猜想 &middot; KAKEYA 3D LAB</b>
        <span>Three.js 数学可视化 &middot; 转针 / Perron 树 / 王虹&ndash;Zahl 证明 / 2026 菲尔兹奖 &middot; 2026-07</span>
      </div>
      <span class="arrow">&rarr;</span>
    </a>
  </div>
  <p class="foot">Powered by GitHub Pages</p>
</div>
</body>
</html>
